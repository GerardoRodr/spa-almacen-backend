services:
  postgres:
    image: postgres:16-alpine
    container_name: almacen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-almacen_erp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-almacen_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - almacen_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: almacen-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-almacen_erp}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-cambiar-en-produccion}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-refresh-key-cambiar-en-produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "3000:3000"
    volumes:
      - api_uploads:/app/uploads
      - api_backups:/app/backups
    networks:
      - almacen_network

volumes:
  pgdata:
    name: almacen_pgdata
  api_uploads:
    name: almacen_uploads
  api_backups:
    name: almacen_backups

networks:
  almacen_network:
    name: almacen_network
