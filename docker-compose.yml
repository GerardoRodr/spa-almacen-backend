# Orquestacion de servicios para SPA-ALMACEN-ERP
services:
  postgres:
    container_name: almacen-postgres
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: almacen_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d almacen_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: almacen_pgdata
